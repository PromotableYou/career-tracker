[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coach-edit"
version = "0.1.0"
description = "CLI for trimming dead air and pulling highlight clips from local coaching video files"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
coach-edit = "coach_edit.cli:main"

[tool.setuptools]
packages = ["coach_edit"]
